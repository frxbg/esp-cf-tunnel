name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan history with pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks.tar.gz | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --log-opts=--all
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 tools/check_publication.py
      - run: python3 tools/generate_fixtures.py --check
      - run: node tests/host/test_sha256.js
      - run: cmake -S . -B build-host -DCMAKE_C_COMPILER=clang -DCF_SANITIZERS=ON -DCF_FUZZING=ON
      - run: cmake --build build-host --parallel 2
      - run: ctest --test-dir build-host --output-on-failure
      - run: mkdir -p build-host/corpus && build-host/cf_parser_fuzz -max_total_time=30 -max_len=16384 build-host/corpus
      - run: python3 tools/package_component.py
  idf:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32p4]
        profile: [no_psram, psram]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = fff9895c82d744c7237be8847347bdd1b07c6643
          python tools/prepare_idf_tls.py --output .cache/idf-v6.1-tls/esp-tls
          python tools/test_idf_tls.py
          sh tools/build_idf.sh '${{ matrix.target }}' '${{ matrix.profile }}' .cache/idf-v6.1-tls/esp-tls
  monitor:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        profile: [yd_s3, no_psram]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/prepare_idf_tls.py --output .cache/idf-v6.1-tls/esp-tls
          python tools/build_monitor.py --profile '${{ matrix.profile }}' --tls-override .cache/idf-v6.1-tls/esp-tls
